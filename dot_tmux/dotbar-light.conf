# tmux-dotbar — light (Kanagawa Paper Canvas)
#
# Derived from colors/kanagawa-paper-canvas.toml, the light Alacritty palette,
# so the same "status bar disappears into the terminal" trick holds: bg is that
# file's colors.primary.background verbatim.
#
#   fg-current  primary.foreground  — the active window, highest contrast
#   fg          normal.white        — inactive windows, deliberately faint
#   fg-session  bright.black        — between the two, as #737c73 is in dark
#   fg-prefix   normal.cyan         — the dragon palette uses its cyan here too
set -g @tmux-dotbar-bg          "#e1e1de"
set -g @tmux-dotbar-fg          "#aeaea6"
set -g @tmux-dotbar-fg-current  "#73787d"
set -g @tmux-dotbar-fg-session  "#99958a"
set -g @tmux-dotbar-fg-prefix   "#7e8faf"
