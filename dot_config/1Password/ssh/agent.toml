# 1Password SSH agent — which keys are offered, and in what order.
#
# Without this file 1Password offers every SSH item in its own order, which
# put "[tomauty] GitHub" first. That key is work-only and the agent refuses
# to sign with it here, so every github.com auth logged
#   sign_and_send_pubkey: ... agent refused operation
# before falling through to the aglowinthefield key that actually works.
#
# Order below is the offer order, so personal keys come first and work keys
# are still available when a work host asks for them. This is not cosmetic:
# sshd's default MaxAuthTries is 6 and there are exactly 6 keys here, so a
# bad order can exhaust the budget and fail auth outright.
#
# Listing a key here is also opt-in — anything omitted stops being offered.

# ── Personal (aglowinthefield) ───────────────────────────────────────────────
[[ssh-keys]]
item = "[aglowinthefield] GH Auth"
vault = "Private"

[[ssh-keys]]
item = "[aglowinthefield] GH Signing"
vault = "Private"

[[ssh-keys]]
item = "Personal SSH Key"
vault = "Private"

# ── Work (tomauty, truex) ────────────────────────────────────────────────────
[[ssh-keys]]
item = "[tomauty] GitHub"
vault = "Private"

[[ssh-keys]]
item = "[truex] GH Auth"
vault = "Private"

[[ssh-keys]]
item = "[truex] GH Signing"
vault = "Private"
