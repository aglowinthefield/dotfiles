# vim:ft=kitty
# -----------------------------------------------------------------------------
# Token  (light)
#
# Converted from ~/code/terminal-tools/share/colors/token-light.toml, itself a
# verbatim conversion of ThorstenRhau/token contrib/kitty/token-light.conf.
# No hue is hand-tuned; re-convert from the plugin after updating it.
#
# The background is load-bearing: #faf9f5 is also @tmux-dotbar-bg in
# terminal-tools' share/tmux/dotbar-light.conf.
#
# Kitty loads this file by name whenever macOS reports light appearance.
# -----------------------------------------------------------------------------

background            #faf9f5
foreground            #323128

cursor                #323128
cursor_text_color     #faf9f5

selection_background  #dddcd6
selection_foreground  #323128

# normal
color0                #323128
color1                #ad5253
color2                #365a33
color3                #857238
color4                #315270
color5                #573c72
color6                #185b5b
color7                #b4b2ab

# bright
color8                #504b44
color9                #863716
color10               #274b24
color11               #6d4717
color12               #335471
color13               #6b5488
color14               #387272
color15               #faf9f5
