# vim:ft=kitty
# -----------------------------------------------------------------------------
# Token  (dark)
#
# Converted from ~/code/terminal-tools/share/colors/token-dark.toml, which is
# itself a verbatim conversion of the neovim colorscheme's kitty extra:
#   ThorstenRhau/token  contrib/kitty/token-dark.conf
# So this round-trips back to the upstream container. No hue is hand-tuned.
# Re-convert from the plugin after updating it, or the terminal and editor
# palettes drift apart.
#
# The background is load-bearing: #262624 is also @tmux-dotbar-bg in
# terminal-tools' share/tmux/dotbar-dark.conf, so the status bar disappears
# into the terminal instead of drawing a line across it. Change one and you
# must change the other.
#
# Kitty loads this file by name whenever macOS reports dark appearance. It is
# not included from kitty.conf and must not be.
# -----------------------------------------------------------------------------

background            #262624
foreground            #c3c0b8

cursor                #c3c0b8
cursor_text_color     #262624

selection_background  #3a3a37
selection_foreground  #c3c0b8

# normal
color0                #1d1d1c
color1                #d68585
color2                #8fb78c
color3                #b99d4a
color4                #81a5c4
color5                #b195ca
color6                #7dbbba
color7                #a6a198

# bright
color8                #8a8884
color9                #f4906f
color10               #a0c89d
color11               #f7c699
color12               #8fb1cb
color13               #bea5d4
color14               #88c0c0
color15               #c3c0b8
