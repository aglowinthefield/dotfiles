# vim:ft=kitty
# macOS always reports light or dark, never no-preference, so this file is only
# reached on a Linux desktop. Point it at dark, the default everywhere else.
#
# Note the GNOME quirk: GNOME reports no-preference when "Dark style" is off,
# i.e. this file is GNOME's *light* mode. Switch the include if kitty ever runs
# on a GNOME machine.
include dark-theme.auto.conf

# Wallpaper lives here because auto_color_scheme overrides these options from kitty.conf.
background_image ~/Pictures/kitty/wall.jpg
background_image_layout scaled
background_tint 0.985
