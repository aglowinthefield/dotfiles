# vim:ft=kitty
# macOS always reports light or dark, never no-preference, so this file is only
# reached on a Linux desktop. Point it at dark to match how the Windows
# alacritty config stays dark rather than following the system appearance.
#
# Note the GNOME quirk: GNOME reports no-preference when "Dark style" is off,
# i.e. this file is GNOME's *light* mode. Switch the include if kitty ever runs
# on a GNOME machine.
include dark-theme.auto.conf
