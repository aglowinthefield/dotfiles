#
# Kitty Configuration
# Reference: https://sw.kovidgoyal.net/kitty/conf/
#
# Ported from ~/.config/alacritty/alacritty.toml. Only settings that differ
# from kitty's defaults live here; `kitty --debug-config` prints the full
# resolved set, and the shipped default dump is at
# /Applications/kitty.app/Contents/Resources/kitty/kitty.conf.
#

# ── Fonts ────────────────────────────────────────────────────────────────────

# Cousine Nerd Font Mono ships Regular/Bold/Italic/Bold Italic only. The
# alacritty config asked for style = "ExtraBold" and silently fell back to
# Bold, since no ExtraBold face exists; `auto` asks for the same result
# honestly and lets kitty resolve each style against the family.
font_family      Cousine Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14

# ── Window ───────────────────────────────────────────────────────────────────

initial_window_width  120c
initial_window_height 30c

# Alacritty's decorations = "Transparent" switched on macOS's fullsize content
# view, which draws the grid *behind* the titlebar — hence padding.y = 28
# there, paid symmetrically at the bottom to keep row 1 out from under the
# traffic lights. Kitty colours the real titlebar instead, so the background
# still runs to the top edge with the buttons and drag intact, and the padding
# hack is not needed. The colour tracks the active window's background, so it
# follows the light/dark switch below.
macos_titlebar_color background
window_padding_width 8

# Sets the working directory and pins the decorative title — kitty has no
# config option for either. See startup.kitty-session for why.
startup_session startup.kitty-session

# ── Cursor ───────────────────────────────────────────────────────────────────

cursor_shape underline

# ── Colors ───────────────────────────────────────────────────────────────────

# Deliberately no palette here, and deliberately no import of one.
#
# Alacritty needed the com.tauty.alacritty-theme launchd agent plus dark-notify
# to regenerate theme.toml on every appearance change. Kitty does it natively:
# when dark-theme.auto.conf / light-theme.auto.conf / no-preference-theme.auto.conf
# exist in this directory it picks the matching one by filename and repaints
# when macOS switches. Nothing includes them and nothing needs to.
#
# Those files override every colour set anywhere else, including `kitty
# --override`, so putting a colour in this file would be a silent no-op.
#
# The palettes are converted from ~/code/terminal-tools/share/colors — keep
# the backgrounds in step with @tmux-dotbar-bg in that repo's share/tmux, or
# the status bar stops disappearing into the terminal.

# `kitten themes` normally edits this file: it appends an include for
# current-theme.conf and comments out any colour setting it finds here. Run it
# as `kitten themes --config-file-name themes.conf` so it edits that file
# instead and this one stays as written. The include below is what makes that
# work, and is why themes.conf exists even while empty.
#
# Note the .auto.conf files above outrank themes.conf, so a theme saved as a
# plain single theme will look like it did nothing. Save it as dark *and* light
# from the kitten, or delete the .auto.conf files to go back to one fixed theme.
include themes.conf

# ── URL hints ────────────────────────────────────────────────────────────────

# Not ported: the [[hints.enabled]] block in alacritty.toml only existed
# because alacritty has no built-in hint mode. Kitty ships one on
# ctrl+shift+e (open) and ctrl+shift+p>u (copy).
