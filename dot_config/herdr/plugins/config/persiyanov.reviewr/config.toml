# reviewr's own settings. herdr's config.toml never reaches this file; the two
# are read by different programs. reviewr re-reads this on every refresh and
# toggle, so edits land without relaunching the pane.

# reviewr ships no token and cannot follow the terminal's light/dark switch the
# way herdr does, so this is fixed dark and will read wrong against
# token-light. gruvbox is the closest in its set: #282828 against token's
# #262624 is the same warm near-black, where tokyo-night's ink blue was not.
theme = "gruvbox"

# The pane opens on prefix+d and not before. Left at the default, reviewr
# attaches itself to every new worktree workspace.
auto_open = false
